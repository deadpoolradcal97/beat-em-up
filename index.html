 else if(ci<9){const wc=idx<=3?2:3;for(let i=0;i<wc;i++)d.waves.push({n:Math.min(7,2+Math.floor(n/22)+i)})}
 else{

/* ---------- combat ---------- */
function hitEnemy(e,dmg,face,kb=2,launch=false){
 if(e.inv||e.state==='down'||e.state==='dead'||e.state==='wait')return;
 e.hp-=dmg;e.flash=8;G.hs=Math.max(G.hs,e.boss?2:3);G.energy=Math.min(100,G.energy+dmg*.28);G.cmb++;G.cmbT=100;G.score+=Math.round(dmg);
 sfx(180+Math.random()*80,.07,'square',.05,-100);spark(e.x,e.y,e.z+16,'#fff',5);spark(e.x,e.y,e.z+16,CHARS[G.ch].pal.glow,4);
 if(e.hp<=0){
  if(e.final&&e.phase<2){startPhase(e);return}
  killEnemy(e,face);return}
 if(e.boss){if(e.state==='walk'||e.state==='rest'){e.state='hurt';e.t=7}e.vx+=face*.4;return}
 if(launch){e.state='fly';e.vz=4.6;e.vx=face*2.8*G.kbm;e.thrown=false;e.did=0}
 else{e.state='hurt';e.t=16;e.vx=face*kb*G.kbm;e.did=0}
 e.face=-face;
}
function killEnemy(e,face){
 e.state='dead';e.t=44;e.vx=face*2.5;e.hp=0;G.score+=e.score;G.kills++;
 spark(e.x,e.y,e.z+14,'#fff',10,3);sfx(90,.25,'sawtooth',.06,-60);
 if(e.boss){G.shake=22;G.hs=14;for(const o of G.en)if(!o.boss&&o.state!=='dead')o.hp=0,o.state='dead',o.t=30;G.pr=[];G.ls=[];ring(e.x,e.y,120,'#fff')}
 else{const r=Math.random();if(r<.13)G.it.push({x:e.x,y:e.y,type:'heal',t:0});else if(r<.24)G.it.push({x:e.x,y:e.y,type:'cell',t:0})}
}
function startPhase(e){
 e.state='phase';e.t=150;e.inv=true;G.pr=[];G.ls=[];G.shake=26;G.banner={text:e.phase===0?'FORMA GIGANTE!':'NÚCLEO DO TEMPO!',t:120};
 for(const o of G.en)if(!o.boss&&o.state!=='dead'){o.state='dead';o.t=30;o.hp=0}
 ring(e.x,e.y,160,'#8affd0');sfx(60,.9,'sawtooth',.07,60);
}
function setPhase(e){
 e.phase++;const F=FPH[e.phase];e.maxhp=F.hp;e.hp=F.hp;e.sc=F.sc;e.moves=F.moves;e.inv=false;e.core=e.phase===2;e.cd=40;
 if(e.core){e.spd=.5}else e.spd=.6;e.w=e.phase===1?24:13;
}
function hurtPlayer(dmg,dir,kb=2.5,frz=0){
 const p=P;if(p.inv>0||p.state==='dying'||G.mode!=='fight'||G.rew>0)return false;
 if(p.state==='guard'&&p.face===-dir){const k=G.ch===2?.08:.45;p.hp-=dmg*k;p.vx=dir*2;G.energy=Math.min(100,G.energy+3);spark(p.x+p.face*10,p.y,p.z+18,'#9ff',6);sfx(300,.06,'triangle',.05);p.inv=10;if(p.hp<=0)die();return true}
 p.hp-=dmg;p.state='hurt';p.t=0;p.vx=dir*kb*G.kbm;p.inv=40;p.flash=10;G.shake=Math.max(G.shake,5);G.cmb=0;G.hs=Math.max(G.hs,3);
 sfx(120,.14,'sawtooth',.06,-60);spark(p.x,p.y,p.z+18,'#f55',8);
 if(frz){p.frozen=frz}
 if(p.z>0)p.vz=Math.max(p.vz,2);
 if(p.hp<=0)die();
 return true;
}
function die(){P.hp=0;P.state='dying';P.dt=170;P.vx=0;P.frozen=0;sfx(70,.5,'sawtooth',.07,-40)}
function playerDeath(){
 G.lives--;
 if(G.lives>0){P.hp=P.maxhp*.6;P.state='idle';P.inv=140;P.z=0;P.vz=0;G.pr=[];G.ls=[];G.banner={text:'VIDAS: '+G.lives,t:70}}
 else{G.mode='over';G.mt=0}
}

/* ---------- player ---------- */
function startAtk(cn){const p=P;p.state='atk';p.cn=cn;p.t=0;p.aid=G.nid++;p.buf=false;p.vx+=p.face*1.1;sfx(260+cn*60,.05,'triangle',.04,120)}
function hitbox(pp,aidKey,range,dmg,kb,launch,mul){
 let any=false;
 for(const e of G.en){
  if(e.state==='dead'||e.state==='wait'||e.state==='down'||e.inv)continue;
  const dx=(e.x-pp.x)*pp.face,rw=e.w*e.sc;
  if(dx>-8&&dx<range+rw*.6&&Math.abs(e.y-pp.y)<14+(e.sc>1.2?5:0)&&Math.abs((e.core?0:e.z)-pp.z)<36){
   if(e[aidKey]===pp.aid)continue;e[aidKey]=pp.aid;hitEnemy(e,dmg*mul,pp.face,kb,launch);any=true}}
 return any;
}
function slam(){
 const p=P,C=CHARS[G.ch],valk=G.ch===1;
 ring(p.x,p.y,valk?80:60,C.pal.glow);G.shake=valk?6:12;sfx(70,.3,'sawtooth',.07,-30);
 for(const e of G.en){if(e.state==='dead'||e.state==='wait'||e.inv)continue;
  if(Math.abs(e.x-p.x)<(valk?85:62)&&Math.abs(e.y-p.y)<26){
   if(valk&&!e.boss){e.x+= (p.x-e.x)*.7;e.y+=(p.y-e.y)*.4}
   hitEnemy(e,valk?7:26,e.x>=p.x?1:-1,3,!valk&&!e.boss)}}
}
function doThrow(){
 const p=P,c=G.en.filter(e=>!e.boss&&['walk','hurt','atk','wind'].includes(e.state)&&Math.abs(e.x-p.x)<70&&Math.abs(e.y-p.y)<24).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x)).slice(0,3);
 if(!c.length)return false;
 const id=G.nid++;p.state='throw';p.t=0;p.vx=0;
 for(const e of c){e.state='fly';e.vx=p.face*5.4*G.thr;e.vz=G.kbm>1?3.6:5.6;e.thrown=true;e.tid=id;e.z=Math.max(e.z,2);e.face=-p.face}
 G.hs=5;sfx(140,.2,'sawtooth',.06,200);return true;
}
function land(){const p=P;if(p.state==='dive'){slam();p.state='idle'}else if(p.state==='jump'||p.state==='jatk')p.state='idle'}
function playerUpdate(){
 const p=P,C=CHARS[G.ch];p.t++;
 if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;
 if(p.state==='dying'){p.dt--;if(p.dt<=0)playerDeath();return}
 if(p.frozen>0){p.frozen--;p.t--;return}
 if(p.z>0||p.vz>0){p.z+=p.vz;p.vz-=G.grav;if(p.z<=0){p.z=0;p.vz=0;land()}}
 p.x=clamp(p.x+p.vx,6,WORLDW-6);p.vx*=.8;
 const can=['idle','walk','jump','guard'].includes(p.state);
 if(p.state==='hurt'){if(p.t>=16){p.state=p.z>0?'jump':'idle';p.t=0}}
 else if(p.state==='atk'){
  const d=C.dur[p.cn];if(pressed.atk)p.buf=true;
  if(p.t===Math.floor(d*.35)){const last=p.cn===C.dmg.length-1;if(hitbox(p,'hid',C.range,C.dmg[p.cn],last?4:2,last,1))G.energy=Math.min(100,G.energy+1)}
  if(p.t>=d){if(p.buf&&p.cn<C.dmg.length-1)startAtk(p.cn+1);else{p.state='idle';p.cn=0;p.t=0}}
 }else if(p.state==='jatk'){
  if(p.t===3)hitbox(p,'hid',C.range+2,9,3,false,1);
  if(p.t>=16)p.state='jump';
 }else if(p.state==='throw'){if(p.t>=22){p.state='idle'}}
 else if(p.state==='dive'){}
 if(can){
  const gr=p.z===0&&p.vz===0;
  if(keys.guard&&gr){if(p.state!=='guard'){p.state='guard';p.t=0}if(G.ch===2&&pressed.atk){if(doThrow())return}}
  else if(p.state==='guard')p.state='idle';
  const mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0),sp=C.spd*(p.state==='guard'?.3:1);
  p.x=clamp(p.x+mx*sp,6,WORLDW-6);p.y=clamp(p.y+my*sp*.7,GY0+8,GY1);
  if(p.state!=='guard'){if(mx)p.face=mx;p.state=gr?(mx||my?'walk':'idle'):'jump';
   if(pressed.jump&&gr){p.vz=G.jv||C.jump;p.z=.1;p.state='jump';sfx(300,.1,'triangle',.04,200)}
   if(pressed.atk){if(gr)startAtk(0);else if(G.ch===0){p.state='jatk';p.t=0;p.aid=G.nid++;sfx(240,.08,'triangle',.04,100)}else{p.state='dive';p.vz=G.kbm>1?-4:-7;p.t=0;sfx(400,.2,'sawtooth',.04,-250)}}}
 }
 // tiles
 if(G.lv.mods.platforms&&p.z===0&&p.inv<=0&&p.state!=='dying'&&!tileOn(Math.floor(p.x/80))){
  p.hp-=10;p.flash=10;p.inv=60;G.shake=6;sfx(100,.3,'sawtooth',.06,-80);let best=0,bd=1e9;for(let i=0;i<8;i++)if(tileOn(i)&&Math.abs(i*80+40-p.x)<bd){bd=Math.abs(i*80+40-p.x);best=i}p.x=best*80+40;spark(p.x,p.y,10,'#8affd0',10);if(p.hp<=0)die()}
}
const tileOn=i=>((G.t+i*47)%400)<300;

/* ---------- time powers ---------- */
function snap(){return{p:{...P},en:G.en.map(e=>({...e})),pr:G.pr.map(o=>({...o})),it:G.it.map(o=>({...o})),hz:G.hz.map(o=>({...o})),ls:G.ls.map(o=>({...o})),t:G.t,score:G.score,wi:G.wi,wph:G.wph,wt:G.wt,kills:G.kills}}
function restore(s){Object.assign(P,s.p);G.en=s.en.map(e=>({...e}));G.pr=s.pr.map(o=>({...o}));G.it=s.it.map(o=>({...o}));G.hz=s.hz.map(o=>({...o}));G.ls=s.ls.map(o=>({...o}));G.t=s.t;G.score=s.score;G.wi=s.wi;G.wph=s.wph;G.wt=s.wt;G.kills=s.kills}
function timePowers(){
 if(G.cdR>0)G.cdR--;
 if(pressed.rew&&G.rew===0&&G.cdR<=0&&G.energy>=50&&G.snaps.length>20){G.energy-=50;G.rew=1;G.cdR=150;G.slowSave=G.slow;sfx(600,.5,'sawtooth',.06,-500)}
 if(pressed.slow&&G.slow<=0&&G.energy>=40&&P.state!=='dying'){G.energy-=40;G.slow=300;sfx(200,.4,'sine',.07,-120)}
 if(pressed.echo&&G.echoT<=0&&G.energy>=30&&P.state!=='dying'){G.energy-=30;G.echoT=360;sfx(500,.3,'sine',.06,300)}
}

/* ---------- enemies ---------- */
function attackers(){return G.en.filter(e=>e.state==='wind'||e.state==='atk').length}
function projectile(o){G.pr.push(Object.assign({life:300,r:6,top:30,z:16,vy:0,kind:'bullet',col:'#ffd23f',dmg:6,frz:0},o))}
function enemyUpdate(e,dt){
 if(e.flash>0)e.flash-=dt;e.age+=dt;
 if(e.state==='wait'){e.t-=dt;if(e.t<=0)e.state='walk';return}
 if(e.state==='dead'){e.t-=dt;e.x+=e.vx*dt;e.vx*=Math.pow(.9,dt);if(e.t<=0)e.rm=true;return}
 if(e.state==='phase'){e.t-=dt;e.hp=Math.min(e.maxhp,e.hp+.0);if(e.t<=0){setPhase(e);e.state='walk'}return}
 if(e.state==='fly'){
  e.x=clamp(e.x+e.vx*dt,4,WORLDW-4);e.z+=e.vz*dt;e.vz-=G.grav*dt;
  if(e.thrown)for(const o of G.en){if(o===e||o.state==='dead'||o.state==='wait'||o.boss||o.tid===e.tid)continue;if(Math.abs(o.x-e.x)<16&&Math.abs(o.y-e.y)<14){o.tid=e.tid;hitEnemy(o,12,Math.sign(e.vx)||1,3,true)}}
  if(e.z<=0){e.z=0;e.vz=0;e.vx*=.3;if(e.thrown){e.thrown=false;e.hp-=14;e.flash=8;G.shake=6;spark(e.x,e.y,4,'#fff',8);if(e.hp<=0){killEnemy(e,Math.sign(e.vx)||1);return}}e.state='down';e.t=45}
  return}
 e.x+=e.vx*dt;e.vx*=Math.pow(.82,dt);
 if(e.state==='hurt'){e.t-=dt;if(e.t<=0)e.state='walk';e.x=clamp(e.x,4,WORLDW-4);return}
 if(e.state==='down'){e.t-=dt;if(e.t<=0){e.state='walk';e.cd=30}return}
 if(e.boss){bossUpdate(e,dt);e.x=clamp(e.x,10,WORLDW-10);e.y=clamp(e.y,GY0+8,GY1);return}
 e.cd-=dt;
 const dx=P.x-e.x,dy=P.y-e.y,ax=Math.abs(dx),ay=Math.abs(dy);
 if(e.state==='walk'){
  e.face=dx>=0?1:-1;
  let tx,ty=P.y;
  if(e.type==='shooter')tx=P.x+e.side*110;else tx=P.x+e.side*(e.rng*.7);
  tx=clamp(tx,16,WORLDW-16);
  const ddx=tx-e.x,ddy=ty-e.y,d=Math.hypot(ddx,ddy)||1,sp=e.spd*dt;
  if(d>3){e.x+=ddx/d*Math.min(sp,d);e.y+=ddy/d*Math.min(sp*.7,d)}
  const inRange=e.type==='shooter'?(Math.abs(e.x-tx)<14&&ay<10):(ax<e.rng+6&&ay<9);
  if(e.type==='elite'&&e.cd<=0&&ax<200&&attackers()<2){e.state='wind';e.t=e.wind;e.did=0}
  else if(inRange&&e.cd<=0&&attackers()<2&&G.mode==='fight'){e.state='wind';e.t=e.wind;e.did=0}
 }else if(e.state==='wind'){
  e.t-=dt;e.face=dx>=0?1:-1;
  if(e.t<=0){
   if(e.type==='shooter'){projectile({x:e.x+e.face*14,y:e.y,vx:e.face*3.2,dmg:e.dmg,col:'#ffd23f'});sfx(500,.08,'square',.04,-200);e.state='walk';e.cd=rnd(70,120)}
   else if(e.type==='elite'){const a=Math.hypot(dx,dy)||1;projectile({x:e.x+e.face*10,y:e.y,vx:dx/a*2.2,vy:dy/a*1.2,dmg:5,col:'#9fe8ff',kind:'freeze',frz:G.lv.mods.freeze?75:40,r:8,life:260});sfx(700,.2,'sine',.05,-300);e.state='walk';e.cd=rnd(90,150)}
   else{e.state='atk';e.t=e.type==='speed'?14:10;e.did=0;if(e.type==='speed')e.vx=e.face*4.2}
  }
 }else if(e.state==='atk'){
  e.t-=dt;
  if(!e.did){const fx=(P.x-e.x)*e.face;if(fx>-6&&fx<e.rng+16&&ay<12&&P.z<30){e.did=1;hurtPlayer(e.dmg,e.face,e.type==='heavy'?4:2.5)}}
  if(e.t<=0){e.state='walk';e.cd=rnd(40,95)}
 }
 for(const o of G.en){if(o===e||o.state==='dead'||o.state==='wait')continue;const ox=e.x-o.x,oy=e.y-o.y;if(Math.abs(ox)<12&&Math.abs(oy)<5){e.x+=(ox>=0?.4:-.4)*dt;e.y+=(oy>=0?.3:-.3)*dt}}
 e.x=clamp(e.x,-30,WORLDW+30);e.y=clamp(e.y,GY0+8,GY1);
}
function bossUpdate(e,dt){
 e.cd-=dt;const dx=P.x-e.x,dy=P.y-e.y;
 if(e.state==='hurt'){e.t-=dt;if(e.t<=0)e.state='walk';return}
 if(e.state==='walk'){
  e.face=dx>=0?1:-1;
  if(e.core){e.x+=(P.x-e.x)*.012*dt;e.y+=(clamp(P.y,GY0+20,GY1)-e.y)*.012*dt;e.z=28+Math.sin(e.age*.05)*6}
  else{const tx=P.x-e.face*34,ddx=tx-e.x,ddy=P.y-e.y,d=Math.hypot(ddx,ddy)||1;if(d>4){e.x+=ddx/d*e.spd*dt;e.y+=ddy/d*e.spd*.7*dt}}
  if(e.cd<=0&&G.mode==='fight'){e.mv=e.moves[ri(0,e.moves.length-1)];e.state='wind';e.t=MV[e.mv].w*(e.final?.8:1);e.did=0}
 }else if(e.state==='wind'){e.face=dx>=0?1:-1;e.t-=dt;if(e.t<=0)beginAct(e)}
 else if(e.state==='act')actUpdate(e,dt);
 else if(e.state==='rest'){e.t-=dt;if(e.t<=0){e.state='walk';e.cd=rnd(22,50)*(e.sub?1.3:1)}}
}
function beginAct(e){
 const mv=e.mv;e.state='act';e.did=0;e.hc=0;e.sp=0;e.at=10;
 const f=e.face;
 if(mv==='charge'){e.at=36;e.vx=f*4.2}
 else if(mv==='saw'){e.at=60;e.vx=f*2.2}
 else if(mv==='dash'){e.at=16;e.vx=f*7.5}
 else if(mv==='slam'){e.at=16;ring(e.x,e.y,70,'#fff');G.shake=Math.max(G.shake,10);sfx(60,.3,'sawtooth',.07,-20);
  if(Math.abs(P.x-e.x)<66&&Math.abs(P.y-e.y)<24&&P.z<12)hurtPlayer(e.dmg,P.x>=e.x?1:-1,4);
  projectile({x:e.x,y:e.y,z:2,top:10,vx:2.6,dmg:e.dmg*.6,kind:'wave',col:'#ffd',r:7,life:160});projectile({x:e.x,y:e.y,z:2,top:10,vx:-2.6,dmg:e.dmg*.6,kind:'wave',col:'#ffd',r:7,life:160})}
 else if(mv==='fan'){const a=Math.atan2((P.y-e.y)*1.4,P.x-e.x);for(let k=-2;k<=2;k++){const b=a+k*.22;projectile({x:e.x+e.face*12,y:e.y,vx:Math.cos(b)*2.5,vy:Math.sin(b)*1.5,dmg:e.dmg*.55,col:e.def.glow})}sfx(420,.15,'square',.05,-200)}
 else if(mv==='fire'){for(const oy of[-30,0,30])projectile({x:e.x+e.face*10,y:clamp(P.y+oy,GY0+8,GY1),z:2,top:12,vx:e.face*2.2,dmg:e.dmg*.7,kind:'wave',col:'#ff7a1a',r:9,life:220});sfx(150,.3,'sawtooth',.05,100)}
 else if(mv==='summon'){const n=G.en.filter(o=>!o.boss&&o.state!=='dead').length;if(n<6)for(let k=0;k<2;k++){const s=mkEnemy(e.def&&e.def.acc==='mummy'?'grunt':'grunt');s.x=clamp(e.x+(k?40:-40),10,WORLDW-10);s.y=clamp(e.y+rnd(-20,20),GY0+8,GY1);s.state='walk';G.en.push(s);spark(s.x,s.y,10,'#fff',8)}ring(e.x,e.y,50,e.def.glow)}
 else if(mv==='teleport'){spark(e.x,e.y,20,'#fff',12);e.x=clamp(P.x-P.face*48,12,WORLDW-12);e.y=P.y;e.face=P.face;spark(e.x,e.y,20,'#fff',12);e.mv='dash';e.state='wind';e.t=13;sfx(800,.15,'sine',.05,-500);return}
 else if(mv==='freeze'){const a=Math.hypot(dxy(e).x,dxy(e).y)||1;projectile({x:e.x,y:e.y,vx:dxy(e).x/a*2.2,vy:dxy(e).y/a*1.3,dmg:6,col:'#9fe8ff',kind:'freeze',frz:70,r:9,life:300});sfx(700,.2,'sine',.05,-300)}
 else if(mv==='lasers'){for(const o of[-80,0,80])G.ls.push({x:clamp(P.x+o,10,WORLDW-10),t:0,tele:45,act:24,hit:0});e.at=12}
 else if(mv==='spiral'){e.at=95}
}
const dxy=e=>({x:P.x-e.x,y:P.y-e.y});
function actUpdate(e,dt){
 e.at-=dt;const mv=e.mv;
 if(mv==='charge'||mv==='saw'||mv==='dash'){
  e.hc-=dt;
  if((!e.did||(mv==='saw'&&e.hc<=0))&&Math.abs(P.x-e.x)<e.w*e.sc*.5+16&&Math.abs(P.y-e.y)<16&&P.z<38){e.did=1;e.hc=14;hurtPlayer(e.dmg*(mv==='dash'?.9:1),e.face,4.5)}
  if(e.x<14||e.x>WORLDW-14)e.vx=0;
 }
 if(mv==='spiral'){e.sp-=dt;if(e.sp<=0){e.sp=6;const a=e.age*.22;projectile({x:e.x,y:e.y,z:26,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.0,dmg:7,col:'#8affd0',life:260});projectile({x:e.x,y:e.y,z:26,vx:-Math.cos(a)*1.8,vy:-Math.sin(a)*1.0,dmg:7,col:'#ff2bd6',life:260})}}
 if(e.at<=0){e.state='rest';e.t=rnd(26,48)*(e.final?.8:1);e.vx*=.2}
}
function projUpdate(dt){
 for(const o of G.pr){
  o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;
  if(o.life<=0||o.x<-20||o.x>WORLDW+20||o.y<GY0-10||o.y>GY1+14)o.rm=true;
  if(!o.rm&&G.mode==='fight'&&Math.abs(o.x-P.x)<o.r+5&&Math.abs(o.y-P.y)<o.r*.8+4&&P.z<o.top){if(hurtPlayer(o.dmg,Math.sign(o.vx)||1,2,o.frz))o.rm=true}

 T('U: liberar todas (teste)',px,200,6,G.cheat?'#ffd23f':'#5a5480',null,false);

 if((pressed.ok||pressed.atk)&&sel<=mx){G.total=0;startLevel(sel);sfx(600,.1,'square',.05)}

}

 ctx.fillStyle='#050218';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(138,255,208,.7)';for(let i=0;i<50;i++)ctx.fillRect((i*73+G.t*.3)%W,(i*41)%H,1,1);

/* ---------- loop ---------- */
function frame(){
 G.tt=(G.tt||0)+1;
 if(pressed.mute){G.muted=!G.muted}
 if(G.scene==='game'){update();ctx.clearRect(0,0,W,H);drawGame()}
 else{G.t++;ctx.clearRect(0,0,W,H);if(G.scene==='title')drawTitle();else if(G.scene==='select')drawSelect();else if(G.scene==='levels')drawLevels();else if(G.scene==='ending')drawEnding()}
 for(const k in pressed)pressed[k]=false;
}
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){frame();acc-=1000/60;n++}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.TV={G,frame,startLevel,press,get P(){return P},keys,pressed,levelDef};
})();
